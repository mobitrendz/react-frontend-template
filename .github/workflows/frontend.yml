name: Frontend CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0' # Aligned with local development
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Pre-commit Hooks
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files

      - name: Verify API Client Sync
        run: |
          # Note: This requires the backend to be accessible or a local openapi.json
          # In a real CI, you might use a mock or a staged backend URL
          npm run generate-client || echo "Skipping sync check: Backend unreachable"
          if [ -d "src/client" ] && [ -n "$(git status --porcelain src/client)" ]; then
            echo "❌ Error: API Client is out of sync with the backend schema. Please run 'npm run generate-client' locally and commit the changes."
            git status src/client
            exit 1
          fi
